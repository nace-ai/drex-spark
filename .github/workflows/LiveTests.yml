#
# Runs opt-in tests against the production Drex API using NACE_LIVE_API_KEY.
# They make 10 billed requests with synthetic content; never schedule them without a dedicated test account.
#
name: Live Tests
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  live-tests:
    name: Tests against the live API
    runs-on: ubuntu-latest
    env:
      NACE_API_KEY: ${{ secrets.NACE_LIVE_API_KEY }}
    steps:
      - name: Check the API key
        run: |
          if [ -z "$NACE_API_KEY" ]; then
            echo "::error::The NACE_LIVE_API_KEY secret is not available to this repository"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Run the live tests
        env:
          DREX_LIVE: '1'
        run: uv run --no-sync pytest tests/live -m live -v
