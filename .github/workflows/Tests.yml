#
# Lint, types, and the tests against the Drex mock (tests/mock/drex_mock.py) in a local SparkSession, on the oldest
# and newest Spark and Python this package supports.
#
name: Tests
on:
  # A pull request runs on its pull_request event alone, not again for the push
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src

  tests:
    name: Python ${{ matrix.python }}, Spark ${{ matrix.spark }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Databricks Runtime 15 and 16 run Spark 3.5
          - { python: '3.10', spark: '3.5.5', pins: "'pandas<2.3' 'numpy<2'" }
          - { python: '3.12', spark: 'locked', pins: '' }
          - { python: '3.13', spark: 'locked', pins: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Pin Spark
        if: matrix.spark != 'locked'
        run: uv pip install "pyspark==${{ matrix.spark }}" ${{ matrix.pins }}
      - name: Check the mock against Drex's schemas
        run: uv run --no-sync python -m unittest discover -s tests/mock -v
      - name: Tests
        run: uv run --no-sync pytest -v
